  {

  {

  {

  {

    "frase": "Muchos hombres siguen siendo niños en cuerpos de adultos \nViven con la comodidad de su madre y las expectativas de su padre \nNo saben qué quieren, pero se quejan de lo que no tienen \nNo se respetan, pero exigen respeto \nLa comodidad ha matado el instinto del hombre \nTodo dado, nada ganado"

  {

  {

  {

  {

  {

  {

  {

  {

  {

  {

  {

  {
