<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexiones</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            text-align: center;
            box-sizing: border-box;
            padding: 20px 15px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #quote-container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: clamp(1.2rem, 5vw, 2.2rem); 
            font-weight: bold;
            line-height: 1.4;
            text-shadow: 1px 1px 8px rgba(255, 0, 0, 0.4);
            margin-top: 0;
            margin-bottom: 15px;
            white-space: pre-line;
        }

        p.category {
            font-size: clamp(0.8rem, 3vw, 1rem); 
            color: #cc0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 25px; 
        }

        /* Contenedor de filtros de categorías */
        #category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        /* BOTONES NO SELECCIONADOS (Mejora de legibilidad) */
        .cat-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #ff4d4d; /* Rojo un poco más claro para mejor contraste sobre negro */
            background-color: transparent;
            border: 1px solid #990000; /* Borde más visible */
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85; /* Subida desde 0.5 para que no se vea apagado */
            transition: all 0.2s ease;
            outline: none;
        }

        /* BOTONES SELECCIONADOS / ACTIVOS */
        .cat-btn.active {
            opacity: 1;
            color: #ff0000; /* Recupera el rojo intenso original */
            border-color: #ff0000;
            background-color: rgba(255, 0, 0, 0.15);
            box-shadow: 0px 0px 8px rgba(255, 0, 0, 0.4);
            font-weight: bold;
        }

        /* Botón Principal */
        #next-btn {
            padding: 10px 20px;
            font-size: 1rem;
            color: #ff0000;
            background-color: transparent;
            border: 2px solid #ff0000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            max-width: 80%; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            #next-btn:hover {
                background-color: #ff0000;
                color: #000000;
                box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.6);
            }
        }

        #next-btn:active {
            background-color: #ff0000;
            color: #000000;
            transform: scale(0.96);
        }

        #next-btn.is-clicked {
            background-color: transparent !important;
            color: #ff0000 !important;
            box-shadow: none !important;
            transform: none !important;
        }

        footer {
            padding-top: 20px;
            padding-bottom: env(safe-area-inset-bottom, 15px);
            color: #cc0000;
            font-size: 1rem;
            opacity: 0.8; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer .autor {
            display: block; 
            margin-top: 6px;
            font-size: 0.78rem; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <main>
        <div id="category-filters"></div>

        <div id="quote-container">
            <h1 id="quote-text">...</h1>
            <p class="category" id="quote-category"></p>
        </div>

        <button id="next-btn">Otra frase</button>
    </main>

    <footer>
        @adler.estoico
    </footer>

    <script>
        let frases = [];
        let categoriasSeleccionadas = new Set();

        // Cargar las frases desde el archivo JSON
        async function cargarFrases() {
            try {
                const response = await fetch('frases.json');
                frases = await response.json();
                
                inicializarFiltros();
                mostrarFraseAleatoria();
            } catch (error) {
                console.error('Error al cargar el JSON:', error);
                document.getElementById('quote-text').innerText = "Error al cargar las frases.";
            }
        }

        // Crear los botones de categoría marcados por defecto
        function inicializarFiltros() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            const categoriasUnicas = [...new Set(frases.map(item => item.categoria))];
            categoriasSeleccionadas = new Set(categoriasUnicas);

            categoriasUnicas.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn active';
                btn.innerText = cat;

                btn.addEventListener('click', () => {
                    if (categoriasSeleccionadas.has(cat)) {
                        categoriasSeleccionadas.delete(cat);
                        btn.classList.remove('active');
                    } else {
                        categoriasSeleccionadas.add(cat);
                        btn.classList.add('active');
                    }
                    mostrarFraseAleatoria();
                });

                container.appendChild(btn);
            });
        }

        // Mostrar frase aleatoria según filtros activos
        function mostrarFraseAleatoria(e) {
            const frasesFiltradas = frases.filter(f => categoriasSeleccionadas.has(f.categoria));

            if (frasesFiltradas.length === 0) {
                document.getElementById('quote-text').innerText = "Selecciona al menos una categoría.";
                document.getElementById('quote-category').innerText = "";
                return;
            }

            const indiceAleatorio = Math.floor(Math.random() * frasesFiltradas.length);
            const seleccion = frasesFiltradas[indiceAleatorio];

            document.getElementById('quote-text').innerText = `"${seleccion.frase}"`;
            document.getElementById('quote-category').innerText = `- ${seleccion.categoria} -`;

            if (e && e.target) {
                const btn = e.target;
                btn.classList.add('is-clicked');
                btn.blur();
            }
        }

        window.onload = cargarFrases;

        const nextBtn = document.getElementById('next-btn');
        nextBtn.addEventListener('click', mostrarFraseAleatoria);

        nextBtn.addEventListener('mouseleave', function() {
            this.classList.remove('is-clicked');
        });
    </script>

</body>
</html>
